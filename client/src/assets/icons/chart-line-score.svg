<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<defs>
<lineargradient id="sg" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#A39EE8" stop-opacity=".3"></stop>
<stop offset="100%" stop-color="#A39EE8" stop-opacity="0"></stop>
</lineargradient>
</defs>
<!-- Grid lines -->
<line stroke="rgba(255,255,255,.05)" stroke-width="1" x1="0" x2="320" y1="20" y2="20"></line>
<line stroke="rgba(255,255,255,.05)" stroke-width="1" x1="0" x2="320" y1="50" y2="50"></line>
<line stroke="rgba(255,255,255,.05)" stroke-width="1" x1="0" x2="320" y1="80" y2="80"></line>
<!-- Labels -->
<text fill="#5F5E5A" font-size="9" x="0" y="23">100%</text>
<text fill="#5F5E5A" font-size="9" x="0" y="53">60%</text>
<text fill="#5F5E5A" font-size="9" x="0" y="83">20%</text>
<!-- Area fill -->
<path d="M30,70 L80,55 L130,45 L180,60 L230,30 L280,25 L280,100 L30,100 Z" fill="url(#sg)"></path>
<!-- Line -->
<path d="M30,70 L80,55 L130,45 L180,60 L230,30 L280,25" fill="none" stroke="#A39EE8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
<!-- Dots -->
<circle cx="30" cy="70" fill="#A39EE8" r="4"></circle>
<circle cx="80" cy="55" fill="#A39EE8" r="4"></circle>
<circle cx="130" cy="45" fill="#A39EE8" r="4"></circle>
<circle cx="180" cy="60" fill="#A39EE8" r="4"></circle>
<circle cx="230" cy="30" fill="#A39EE8" r="4"></circle>
<circle cx="280" cy="25" fill="#534AB7" r="5" stroke="#A39EE8" stroke-width="2"></circle>
<!-- X labels -->
<text fill="#5F5E5A" font-size="9" x="22" y="108">Jan</text>
<text fill="#5F5E5A" font-size="9" x="72" y="108">Feb</text>
<text fill="#5F5E5A" font-size="9" x="122" y="108">Mar</text>
<text fill="#5F5E5A" font-size="9" x="172" y="108">Apr</text>
<text fill="#5F5E5A" font-size="9" x="222" y="108">May</text>
<text fill="#A39EE8" font-size="9" font-weight="600" x="265" y="108">Now</text>
</svg>